
name: Build Seedr Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: seedr-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Checking Android SDK..."
          echo "ANDROID_HOME=$ANDROID_HOME"

          command -v sdkmanager

          echo "Installing Android SDK components..."

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "Installed SDK packages:"
          sdkmanager --list_installed

      - name: Locate Android project
        shell: bash
        run: |
          set -Eeuo pipefail

          ROOT="$GITHUB_WORKSPACE"
          EXTRACT_ROOT="$RUNNER_TEMP/seedr-extracted"

          mkdir -p "$EXTRACT_ROOT"

          is_project() {
            local d="$1"

            [[ -f "$d/settings.gradle.kts" || -f "$d/settings.gradle" ]] &&
            [[ -f "$d/app/build.gradle.kts" || -f "$d/app/build.gradle" ]]
          }

          PROJECT=""

          if is_project "$ROOT"; then
            PROJECT="$ROOT"
          else
            shopt -s nullglob
            ZIPS=("$ROOT"/*.zip)
            shopt -u nullglob

            if (( ${#ZIPS[@]} == 0 )); then
              echo "::error::No Android project or ZIP found."
              exit 1
            fi

            INDEX=0

            for ZIP in "${ZIPS[@]}"; do
              INDEX=$((INDEX + 1))
              DEST="$EXTRACT_ROOT/archive-$INDEX"

              mkdir -p "$DEST"

              python3 - "$ZIP" "$DEST" <<'PY'
          import os
          import sys
          import zipfile

          archive = sys.argv[1]
          destination = os.path.abspath(sys.argv[2])

          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  target = os.path.abspath(
                      os.path.join(destination, item.filename)
                  )

                  if os.path.commonpath([destination, target]) != destination:
                      raise SystemExit("Unsafe ZIP path: " + item.filename)

              z.extractall(destination)

          print("Extracted:", archive)
          PY

              while IFS= read -r -d '' SETTINGS; do
                CANDIDATE="$(dirname "$SETTINGS")"

                if is_project "$CANDIDATE"; then
                  if [[ -n "$PROJECT" ]]; then
                    echo "::error::Multiple Android projects found."
                    exit 1
                  fi

                  PROJECT="$CANDIDATE"
                fi
              done < <(
                find "$DEST" \
                  -type d \( \
                    -name .git -o \
                    -name build -o \
                    -name .gradle -o \
                    -name node_modules \
                  \) -prune \
                  -o \( \
                    -name settings.gradle.kts -o \
                    -name settings.gradle \
                  \) -type f -print0
              )
            done
          fi

          if [[ -z "$PROJECT" ]]; then
            echo "::error::Android project not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

          echo "Selected project: $PROJECT"

          ls -la "$PROJECT"
          ls -la "$PROJECT/app"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Verify build environment
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "===== JAVA ====="
          java -version

          echo "===== GRADLE ====="
          gradle --version

          echo "===== ANDROID SDK ====="
          echo "$ANDROID_HOME"

          echo "===== PROJECT CONFIGURATION ====="

          test -f settings.gradle.kts -o -f settings.gradle

          test -f app/build.gradle.kts -o -f app/build.gradle

          echo "Project verification completed."

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Starting Gradle build..."

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            :app:assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -f "$APK" ]]; then
            echo "::error::APK file not found."

            find app/build/outputs -type f -print || true

            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK" "$GITHUB_WORKSPACE/output/Seedr-debug.apk"

          echo "APK successfully generated."

          ls -lh "$GITHUB_WORKSPACE/output/Seedr-debug.apk"

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Seedr-Android-Debug-APK
          path: output/Seedr-debug.apk
          if-no-files-found: error
          retention-days: 14

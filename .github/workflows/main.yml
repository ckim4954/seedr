
name: Build Seedr Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: seedr-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Seedr Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      # ==========================================
      # 1. CHECKOUT REPOSITORY
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v5

      # ==========================================
      # 2. FIND AND EXTRACT ANDROID SOURCE
      # ==========================================
      - name: Locate and extract Seedr source
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 <<'PY'
          import os
          import sys
          import zipfile
          from pathlib import Path, PurePosixPath

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          destination = workspace / "_seedr_android_source"

          def is_project(directory):
              return (
                  (directory / "settings.gradle.kts").is_file()
                  or (directory / "settings.gradle").is_file()
              ) and (
                  (directory / "app/build.gradle.kts").is_file()
                  or (directory / "app/build.gradle").is_file()
              )

          project = None

          if is_project(workspace):
              project = workspace

          if project is None:
              archives = []

              for path in workspace.rglob("*.zip"):
                  if ".git" in path.parts:
                      continue
                  if path.name.lower().startswith("logs_"):
                      continue
                  archives.append(path)

              candidates = []

              for archive in archives:
                  try:
                      with zipfile.ZipFile(archive) as z:
                          names = set(z.namelist())

                          for name in names:
                              p = PurePosixPath(name)

                              if p.name not in (
                                  "settings.gradle.kts",
                                  "settings.gradle"
                              ):
                                  continue

                              prefix = str(p.parent)
                              if prefix == ".":
                                  prefix = ""

                              gradle_files = [
                                  f"{prefix}/app/build.gradle.kts",
                                  f"{prefix}/app/build.gradle"
                              ]

                              if any(f in names for f in gradle_files):
                                  candidates.append((archive, prefix))
                  except Exception as error:
                      print(f"Skipping {archive}: {error}")

              if len(candidates) == 0:
                  print("ERROR: No Android project or source ZIP found.")
                  print("Repository contents:")
                  for item in workspace.iterdir():
                      print(item.name)
                  sys.exit(1)

              if len(candidates) > 1:
                  print("ERROR: Multiple Android source archives found:")
                  for archive, prefix in candidates:
                      print(archive, prefix)
                  sys.exit(1)

              archive, prefix = candidates[0]

              if destination.exists():
                  import shutil
                  shutil.rmtree(destination)

              destination.mkdir(parents=True)

              with zipfile.ZipFile(archive) as z:
                  for item in z.infolist():
                      target = (destination / item.filename).resolve()

                      if not target.is_relative_to(destination.resolve()):
                          raise RuntimeError(
                              f"Unsafe ZIP entry: {item.filename}"
                          )

                  z.extractall(destination)

              project = destination / prefix if prefix else destination

          if not is_project(project):
              print("ERROR: Extracted project structure is invalid.")
              sys.exit(1)

          project = project.resolve()

          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"PROJECT_DIR={project}\n")

          print("===================================")
          print("ANDROID PROJECT FOUND")
          print(project)
          print("===================================")

          for item in project.iterdir():
              print(item.name)
          PY

      # ==========================================
      # 3. VERIFY SOURCE BEFORE JAVA SETUP
      # ==========================================
      - name: Verify Android source
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          REQUIRED_FILES=(
            "settings.gradle.kts"
            "build.gradle.kts"
            "gradle/libs.versions.toml"
            "gradle/wrapper/gradle-wrapper.properties"
            "app/build.gradle.kts"
            "app/src/main/AndroidManifest.xml"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [[ ! -f "$FILE" ]]; then
              echo "::error::Missing source file: $FILE"
              exit 1
            fi

            echo "OK: $FILE"
          done

          echo "Kotlin source count:"
          find app/src/main -type f -name '*.kt' | wc -l

      # ==========================================
      # 4. JAVA 17
      # IMPORTANT: NO GRADLE CACHE HERE
      # ==========================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # 5. ANDROID SDK MANAGER
      # ==========================================
      - name: Locate Android SDK Manager
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -d "$ANDROID_HOME" ]]; then
            echo "::error::Android SDK not found."
            exit 1
          fi

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null \
            | sort -V | tail -n 1)"

          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::SDK Manager not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "Using: $SDKMANAGER"

      # ==========================================
      # 6. SDK LICENSES
      # ==========================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -Eeuo pipefail

          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail

          echo "SDK licenses accepted."

      # ==========================================
      # 7. INSTALL SDK COMPONENTS
      # ==========================================
      - name: Install Android SDK components
        shell: bash
        run: |
          set -Eeuo pipefail

          PACKAGES=()

          [[ -d "$ANDROID_HOME/platforms/android-36" ]] || \
            PACKAGES+=("platforms;android-36")

          [[ -d "$ANDROID_HOME/build-tools/36.0.0" ]] || \
            PACKAGES+=("build-tools;36.0.0")

          [[ -d "$ANDROID_HOME/platform-tools" ]] || \
            PACKAGES+=("platform-tools")

          if (( ${#PACKAGES[@]} > 0 )); then
            "$SDKMANAGER" --install "${PACKAGES[@]}"
          fi

          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          test -d "$ANDROID_HOME/platform-tools"

          echo "SDK installation verified."

      # ==========================================
      # 8. PREPARE DEBUG KEYSTORE
      # ==========================================
      - name: Prepare debug keystore
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f debug.keystore ]]; then
            keytool -genkeypair \
              -noprompt \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          keytool -list \
            -keystore debug.keystore \
            -storepass android

          echo "Debug keystore ready."

      # ==========================================
      # 9. SET UP GRADLE AFTER SOURCE EXTRACTION
      # ==========================================
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      # ==========================================
      # 10. VERIFY BUILD ENVIRONMENT
      # ==========================================
      - name: Verify build environment
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          java -version
          gradle --version

          echo "Gradle configuration:"
          cat gradle/wrapper/gradle-wrapper.properties

          echo "SDK platforms:"
          ls "$ANDROID_HOME/platforms"

          echo "Build tools:"
          ls "$ANDROID_HOME/build-tools"

      # ==========================================
      # 11. BUILD APK
      # ==========================================
      - name: Build Seedr Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --no-configuration-cache \
            :app:assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$APK" ]]; then
            echo "::error::APK was not generated."

            find app/build/outputs -type f -print || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK" "$GITHUB_WORKSPACE/output/Seedr-debug.apk"

          echo "APK successfully generated."
          ls -lh "$GITHUB_WORKSPACE/output/Seedr-debug.apk"

      # ==========================================
      # 12. VERIFY APK
      # ==========================================
      - name: Verify APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="$GITHUB_WORKSPACE/output/Seedr-debug.apk"

          test -s "$APK"

          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"

          if [[ -x "$AAPT" ]]; then
            "$AAPT" dump badging "$APK" | head -n 5
          fi

          sha256sum "$APK"

      # ==========================================
      # 13. UPLOAD APK
      # ==========================================
      - name: Upload Seedr APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Seedr-Android-APK
          path: output/Seedr-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ==========================================
      # 14. UPLOAD DIAGNOSTICS
      # ==========================================
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Seedr-Build-Diagnostics
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 14

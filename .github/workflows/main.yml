
name: Build Seedr Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '**'
      - '!README.md'

permissions:
  contents: read

concurrency:
  group: seedr-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate or extract Android project
        shell: bash
        run: |
          set -Eeuo pipefail

          ROOT="$GITHUB_WORKSPACE"
          EXTRACT_ROOT="$RUNNER_TEMP/seedr-extracted"
          mkdir -p "$EXTRACT_ROOT"

          is_android_project() {
            local dir="$1"
            [[ -f "$dir/settings.gradle" || -f "$dir/settings.gradle.kts" ]] && \
            [[ -f "$dir/app/build.gradle" || -f "$dir/app/build.gradle.kts" ]]
          }

          PROJECT_DIR=""

          if is_android_project "$ROOT"; then
            PROJECT_DIR="$ROOT"
          fi

          if [[ -z "$PROJECT_DIR" ]]; then
            shopt -s nullglob
            ZIP_FILES=("$ROOT"/*.zip)
            shopt -u nullglob

            if (( ${#ZIP_FILES[@]} == 0 )); then
              echo "::error::No Android project found and no ZIP archive exists."
              exit 1
            fi

            INDEX=0
            for ARCHIVE in "${ZIP_FILES[@]}"; do
              INDEX=$((INDEX + 1))
              DEST="$EXTRACT_ROOT/archive-$INDEX"
              mkdir -p "$DEST"

              python3 - "$ARCHIVE" "$DEST" <<'PY'
          import os
          import sys
          import zipfile

          archive, destination = sys.argv[1], os.path.abspath(sys.argv[2])
          with zipfile.ZipFile(archive) as zf:
              for member in zf.infolist():
                  target = os.path.abspath(os.path.join(destination, member.filename))
                  if os.path.commonpath((destination, target)) != destination:
                      raise SystemExit(f"Unsafe ZIP entry: {member.filename}")
              zf.extractall(destination)
          print(f"Extracted: {archive}")
          PY

              while IFS= read -r -d '' SETTINGS_FILE; do
                CANDIDATE="$(dirname "$SETTINGS_FILE")"
                if is_android_project "$CANDIDATE"; then
                  if [[ -n "$PROJECT_DIR" ]]; then
                    echo "::error::Multiple Android projects found."
                    exit 1
                  fi
                  PROJECT_DIR="$CANDIDATE"
                fi
              done < <(
                find "$DEST" \
                  -type d \( -name .git -o -name .gradle -o -name build -o -name node_modules \) -prune \
                  -o \( -name settings.gradle -o -name settings.gradle.kts \) -type f -print0
              )
            done
          fi

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "::error::No valid Android project found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Selected project: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"
          ls -la "$PROJECT_DIR/app"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Verify build configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          java -version
          gradle --version

          test -f settings.gradle.kts -o -f settings.gradle
          test -f app/build.gradle.kts -o -f app/build.gradle

          if [[ -f gradle/wrapper/gradle-wrapper.properties ]]; then
            cat gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          gradle --no-daemon --stacktrace --warning-mode all :app:assembleDebug

          mkdir -p "$GITHUB_WORKSPACE/output"

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -f "$APK_PATH" ]]; then
            echo "::error::APK not found."
            find app/build/outputs -type f -print || true
            exit 1
          fi

          cp "$APK_PATH" "$GITHUB_WORKSPACE/output/Seedr-debug.apk"

          ls -lh "$GITHUB_WORKSPACE/output/Seedr-debug.apk"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Seedr-Android-Debug-APK
          path: output/Seedr-debug.apk
          if-no-files-found: error
          retention-days: 14

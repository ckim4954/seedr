
name: Build Seedr Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: seedr-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Seedr Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      # ==========================================
      # 1. CHECKOUT SOURCE
      # ==========================================
      - name: Checkout source code
        uses: actions/checkout@v4

      # ==========================================
      # 2. JAVA ENVIRONMENT
      # ==========================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ==========================================
      # 3. LOCATE ANDROID SDK
      # ==========================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"

          if [[ ! -d "$ANDROID_HOME" ]]; then
            echo "::error::Android SDK not found."
            exit 1
          fi

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [[ ! -f "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager 2>/dev/null \
              | sort -V | tail -n 1)"
          fi

          if [[ -z "$SDKMANAGER" || ! -f "$SDKMANAGER" ]]; then
            echo "::error::SDK Manager not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "SDK Manager: $SDKMANAGER"

          echo "Installed SDK directories:"
          ls -la "$ANDROID_HOME"

      # ==========================================
      # 4. ACCEPT SDK LICENSES
      # ==========================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -Eeuo pipefail

          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail

          echo "Android SDK licenses accepted."

      # ==========================================
      # 5. INSTALL REQUIRED SDK PACKAGES
      # ==========================================
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -Eeuo pipefail

          PACKAGES=()

          if [[ ! -d "$ANDROID_HOME/platforms/android-36" ]]; then
            PACKAGES+=("platforms;android-36")
          fi

          if [[ ! -d "$ANDROID_HOME/build-tools/36.0.0" ]]; then
            PACKAGES+=("build-tools;36.0.0")
          fi

          if [[ ! -d "$ANDROID_HOME/platform-tools" ]]; then
            PACKAGES+=("platform-tools")
          fi

          if (( ${#PACKAGES[@]} > 0 )); then
            echo "Installing missing SDK packages..."

            "$SDKMANAGER" --install "${PACKAGES[@]}"
          else
            echo "All required SDK packages are already installed."
          fi

          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          test -d "$ANDROID_HOME/platform-tools"

          echo "Android SDK verification successful."

      # ==========================================
      # 6. FIND OR EXTRACT ANDROID PROJECT
      # ==========================================
      - name: Locate Android project
        shell: bash
        run: |
          set -Eeuo pipefail

          ROOT="$GITHUB_WORKSPACE"
          EXTRACT_ROOT="$RUNNER_TEMP/seedr-projects"

          mkdir -p "$EXTRACT_ROOT"

          is_android_project() {
            local dir="$1"

            [[ -f "$dir/settings.gradle.kts" || \
               -f "$dir/settings.gradle" ]] &&
            [[ -f "$dir/app/build.gradle.kts" || \
               -f "$dir/app/build.gradle" ]]
          }

          PROJECT=""

          if is_android_project "$ROOT"; then
            PROJECT="$ROOT"
          else
            shopt -s nullglob
            ZIP_FILES=("$ROOT"/*.zip)
            shopt -u nullglob

            if (( ${#ZIP_FILES[@]} == 0 )); then
              echo "::error::No Android project or ZIP found."
              exit 1
            fi

            INDEX=0

            for ZIP in "${ZIP_FILES[@]}"; do
              INDEX=$((INDEX + 1))

              DEST="$EXTRACT_ROOT/archive-$INDEX"
              mkdir -p "$DEST"

              python3 - "$ZIP" "$DEST" <<'PY'
          import os
          import sys
          import zipfile

          archive = sys.argv[1]
          destination = os.path.abspath(sys.argv[2])

          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  target = os.path.abspath(
                      os.path.join(destination, item.filename)
                  )

                  if os.path.commonpath(
                      [destination, target]
                  ) != destination:
                      raise SystemExit(
                          "Unsafe ZIP entry: " + item.filename
                      )

              z.extractall(destination)

          print("Extracted:", archive)
          PY

              while IFS= read -r -d '' SETTINGS; do
                CANDIDATE="$(dirname "$SETTINGS")"

                if is_android_project "$CANDIDATE"; then
                  if [[ -n "$PROJECT" ]]; then
                    echo "::error::Multiple Android projects found."
                    exit 1
                  fi

                  PROJECT="$CANDIDATE"
                fi
              done < <(
                find "$DEST" \
                  -type d \( \
                    -name .git -o \
                    -name build -o \
                    -name .gradle -o \
                    -name node_modules \
                  \) -prune \
                  -o \( \
                    -name settings.gradle.kts -o \
                    -name settings.gradle \
                  \) -type f -print0
              )
            done
          fi

          if [[ -z "$PROJECT" ]]; then
            echo "::error::Android project not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

          echo "================================"
          echo "ANDROID PROJECT FOUND"
          echo "$PROJECT"
          echo "================================"

          echo "Project root:"
          ls -la "$PROJECT"

          echo "App module:"
          ls -la "$PROJECT/app"

      # ==========================================
      # 7. VERIFY PROJECT SOURCE
      # ==========================================
      - name: Verify Seedr source files
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          REQUIRED_FILES=(
            "settings.gradle.kts"
            "build.gradle.kts"
            "gradle/libs.versions.toml"
            "gradle/wrapper/gradle-wrapper.properties"
            "app/build.gradle.kts"
            "app/src/main/AndroidManifest.xml"
            "app/src/main/java/com/example/MainActivity.kt"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [[ ! -f "$FILE" ]]; then
              echo "::error::Missing required file: $FILE"
              exit 1
            fi

            echo "OK: $FILE"
          done

          echo "Checking Kotlin source files..."

          KOTLIN_COUNT=$(find app/src/main/java \
            -type f -name '*.kt' | wc -l)

          echo "Kotlin files: $KOTLIN_COUNT"

          if [[ "$KOTLIN_COUNT" -eq 0 ]]; then
            echo "::error::No Kotlin source files found."
            exit 1
          fi

          echo "Source verification successful."

      # ==========================================
      # 8. GENERATE DEBUG KEYSTORE IF MISSING
      # ==========================================
      - name: Prepare Debug Signing
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          KEYSTORE="debug.keystore"

          if [[ ! -f "$KEYSTORE" ]]; then
            echo "Generating Android debug keystore..."

            keytool -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "Debug keystore already exists."
          fi

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey

          echo "Debug signing verified."

      # ==========================================
      # 9. SET UP GRADLE
      # ==========================================
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      # ==========================================
      # 10. VERIFY JAVA AND GRADLE
      # ==========================================
      - name: Verify build environment
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "===== JAVA ====="
          java -version

          echo "===== GRADLE ====="
          gradle --version

          echo "===== ANDROID SDK ====="
          echo "ANDROID_HOME=$ANDROID_HOME"

          echo "===== SDK PLATFORMS ====="
          ls -la "$ANDROID_HOME/platforms"

          echo "===== BUILD TOOLS ====="
          ls -la "$ANDROID_HOME/build-tools/36.0.0"

          echo "===== GRADLE WRAPPER CONFIG ====="
          cat gradle/wrapper/gradle-wrapper.properties

          echo "Environment verification successful."

      # ==========================================
      # 11. BUILD APK
      # ==========================================
      - name: Build Seedr Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "================================"
          echo "STARTING SEEDR APK BUILD"
          echo "================================"

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --no-configuration-cache \
            :app:assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -f "$APK" ]]; then
            echo "::error::APK was not generated."

            echo "Available build outputs:"
            find app/build/outputs -type f -print || true

            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/output/Seedr-debug.apk"

          echo "================================"
          echo "APK BUILD SUCCESSFUL"
          echo "================================"

          ls -lh "$GITHUB_WORKSPACE/output/Seedr-debug.apk"

      # ==========================================
      # 12. VERIFY APK
      # ==========================================
      - name: Verify generated APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="$GITHUB_WORKSPACE/output/Seedr-debug.apk"

          test -s "$APK"

          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"

          if [[ -f "$AAPT" ]]; then
            "$AAPT" dump badging "$APK" | head -n 5
          fi

          sha256sum "$APK"

          echo "APK verification completed."

      # ==========================================
      # 13. UPLOAD APK ARTIFACT
      # ==========================================
      - name: Upload Seedr APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Seedr-Android-APK
          path: output/Seedr-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ==========================================
      # 14. UPLOAD BUILD LOGS ON FAILURE
      # ==========================================
      - name: Upload diagnostic information
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Seedr-Build-Diagnostics
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/
            ${{ env.PROJECT_DIR }}/app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 14


name: Android Universal Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: android-universal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Detect, Prepare and Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. LOCATE OR EXTRACT ANDROID SOURCE
      # ==========================================

      - name: Find and extract Android project
        id: source
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 <<'PY'
          import os
          import sys
          import zipfile
          import shutil
          from pathlib import Path, PurePosixPath

          root = Path(os.environ["GITHUB_WORKSPACE"])
          extract_root = Path(os.environ["RUNNER_TEMP"]) / "android-source"

          extract_root.mkdir(parents=True, exist_ok=True)

          def is_project(d):
              return (
                  (d / "settings.gradle").is_file()
                  or (d / "settings.gradle.kts").is_file()
              ) and (
                  (d / "app/build.gradle").is_file()
                  or (d / "app/build.gradle.kts").is_file()
              )

          project = root if is_project(root) else None

          if project is None:
              archives = []

              for p in root.rglob("*.zip"):
                  if ".git" in p.parts:
                      continue
                  if any(x.startswith("logs_") for x in p.parts):
                      continue
                  if p.name.lower().startswith("logs"):
                      continue
                  if extract_root in p.parents:
                      continue
                  archives.append(p)

              candidates = []

              for archive in archives:
                  try:
                      with zipfile.ZipFile(archive) as z:
                          names = set(z.namelist())

                          for name in names:
                              item = PurePosixPath(name)

                              if item.name not in (
                                  "settings.gradle",
                                  "settings.gradle.kts"
                              ):
                                  continue

                              prefix = str(item.parent)
                              if prefix == ".":
                                  prefix = ""

                              possible = [
                                  f"{prefix}/app/build.gradle",
                                  f"{prefix}/app/build.gradle.kts"
                              ]

                              if any(x in names for x in possible):
                                  candidates.append((archive, prefix))

                  except Exception as e:
                      print(f"Skipping archive {archive}: {e}")

              if len(candidates) == 0:
                  print("ERROR: No valid Android source found.")
                  print("Repository contents:")
                  for item in root.iterdir():
                      print(item.name)
                  sys.exit(1)

              if len(candidates) > 1:
                  print("ERROR: Multiple Android projects found.")
                  print("Keep only one source ZIP or place the intended")
                  print("Android project directly in the repository root.")
                  for archive, prefix in candidates:
                      print(archive, prefix)
                  sys.exit(1)

              archive, prefix = candidates[0]

              if extract_root.exists():
                  shutil.rmtree(extract_root)

              extract_root.mkdir(parents=True)

              with zipfile.ZipFile(archive) as z:
                  for member in z.infolist():
                      target = (
                          extract_root / member.filename
                      ).resolve()

                      if not target.is_relative_to(
                          extract_root.resolve()
                      ):
                          raise RuntimeError(
                              "Unsafe ZIP entry: " + member.filename
                          )

                  z.extractall(extract_root)

              project = extract_root / prefix if prefix else extract_root

          if not is_project(project):
              print("ERROR: Android project structure is invalid.")
              sys.exit(1)

          project = project.resolve()

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"PROJECT_DIR={project}\n")

          print("================================")
          print("ANDROID PROJECT DETECTED")
          print(project)
          print("================================")

          for item in project.iterdir():
              print(item.name)
          PY

      # ==========================================
      # 3. ANALYZE PROJECT AND VERSIONS
      # ==========================================

      - name: Analyze Android project
        id: analyze
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path.cwd()

          def read(path):
              p = root / path
              return p.read_text(errors="ignore") if p.is_file() else ""

          files = [
              "settings.gradle",
              "settings.gradle.kts",
              "build.gradle",
              "build.gradle.kts",
              "app/build.gradle",
              "app/build.gradle.kts",
              "gradle/libs.versions.toml",
          ]

          content = "\n".join(read(x) for x in files)

          wrapper = read("gradle/wrapper/gradle-wrapper.properties")

          gradle_version = None

          match = re.search(
              r"gradle-([0-9][0-9A-Za-z.+-]*)-(?:bin|all)\.zip",
              wrapper
          )

          if match:
              gradle_version = match.group(1)

          agp_match = re.search(
              r"(?:com\.android\.application|com\.android\.library|"
              r"com\.android\.tools\.build:gradle|agp)"
              r"[^0-9]{0,40}([0-9]+\.[0-9]+(?:\.[0-9]+)?)",
              content
          )

          agp = agp_match.group(1) if agp_match else None

          compile_sdk = None

          sdk_patterns = [
              r"compileSdk(?:Version)?\s*[=:]?\s*(?:\"|')?(\d+)",
              r"compileSdk\s*\(\s*(\d+)\s*\)",
              r"compileSdk\s+(\d+)",
          ]

          for pattern in sdk_patterns:
              m = re.search(pattern, content)
              if m:
                  compile_sdk = m.group(1)
                  break

          if not compile_sdk:
              toml = read("gradle/libs.versions.toml")
              m = re.search(
                  r"compileSdk\s*=\s*[\"']?(\d+)",
                  toml
              )
              if m:
                  compile_sdk = m.group(1)

          compile_sdk = compile_sdk or "36"

          build_tools = None
          m = re.search(
              r"buildToolsVersion\s*[=( ]+\s*[\"']([0-9.]+)",
              content
          )
          if m:
              build_tools = m.group(1)

          compatibility = {
              "9.1": "9.3.1",
              "9.0": "9.1.0",
              "8.13": "8.13",
              "8.12": "8.13",
              "8.11": "8.13",
              "8.10": "8.11.1",
              "8.9": "8.11.1",
              "8.8": "8.10.2",
              "8.7": "8.9",
              "8.6": "8.7",
              "8.5": "8.7",
              "8.4": "8.6",
              "8.3": "8.4",
              "8.2": "8.2",
              "8.1": "8.0",
              "8.0": "8.0",
              "7.4": "7.5",
              "7.3": "7.4",
              "7.2": "7.3.3",
              "7.1": "7.2",
              "7.0": "7.0.2",
          }

          if not gradle_version:
              if not agp:
                  raise SystemExit(
                      "Cannot determine Gradle version. "
                      "Add Gradle Wrapper or declare Android Gradle Plugin version."
                  )

              prefix = ".".join(agp.split(".")[:2])

              gradle_version = compatibility.get(prefix)

              if not gradle_version:
                  raise SystemExit(
                      f"No known Gradle mapping for AGP {agp}. "
                      "Add a compatible Gradle Wrapper."
                  )

          parts = gradle_version.split(".")
          major = int(parts[0])
          minor = int(parts[1]) if len(parts) > 1 else 0

          java_version = "17" if (
              major > 7 or (major == 7 and minor >= 3)
          ) else "11"

          values = {
              "gradle_version": gradle_version,
              "agp_version": agp or "unknown",
              "compile_sdk": compile_sdk,
              "build_tools": build_tools or "",
              "java_version": java_version,
          }

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              for key, value in values.items():
                  f.write(f"{key}={value}\n")

          print("================================")
          print("PROJECT ANALYSIS")
          print("================================")

          for key, value in values.items():
              print(f"{key}: {value}")
          PY

      # ==========================================
      # 4. SET UP JAVA
      # ==========================================

      - name: Install compatible Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.analyze.outputs.java_version }}

      # ==========================================
      # 5. FIND ANDROID SDK MANAGER
      # ==========================================

      - name: Find Android SDK Manager
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -d "$ANDROID_HOME" ]]; then
            echo "::error::Android SDK directory not found."
            exit 1
          fi

          SDKMANAGER="$(
            find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager 2>/dev/null \
              | sort -V | tail -n 1
          )"

          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::SDK Manager not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "SDK Manager: $SDKMANAGER"

      # ==========================================
      # 6. ACCEPT SDK LICENSES
      # ==========================================

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -Eeuo pipefail

          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail

      # ==========================================
      # 7. INSTALL MISSING SDK COMPONENTS
      # ==========================================

      - name: Install required Android SDK
        shell: bash
        env:
          COMPILE_SDK: ${{ steps.analyze.outputs.compile_sdk }}
          BUILD_TOOLS: ${{ steps.analyze.outputs.build_tools }}
        run: |
          set -Eeuo pipefail

          PACKAGES=()

          if [[ ! -d "$ANDROID_HOME/platforms/android-$COMPILE_SDK" ]]; then
            PACKAGES+=("platforms;android-$COMPILE_SDK")
          fi

          if [[ ! -d "$ANDROID_HOME/platform-tools" ]]; then
            PACKAGES+=("platform-tools")
          fi

          if [[ -n "$BUILD_TOOLS" ]] && \
             [[ ! -d "$ANDROID_HOME/build-tools/$BUILD_TOOLS" ]]; then
            PACKAGES+=("build-tools;$BUILD_TOOLS")
          fi

          if (( ${#PACKAGES[@]} > 0 )); then
            echo "Installing missing SDK components:"
            printf '%s\n' "${PACKAGES[@]}"

            "$SDKMANAGER" --install "${PACKAGES[@]}"
          else
            echo "Required SDK components already exist."
          fi

          test -d "$ANDROID_HOME/platforms/android-$COMPILE_SDK"
          test -d "$ANDROID_HOME/platform-tools"

          echo "Android SDK ready."

      # ==========================================
      # 8. SET UP COMPATIBLE GRADLE
      # ==========================================

      - name: Install compatible Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.analyze.outputs.gradle_version }}
          cache-read-only: false

      # ==========================================
      # 9. PREPARE GRADLE WRAPPER
      # ==========================================

      - name: Prepare Gradle execution
        id: gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -f gradlew && -f gradle/wrapper/gradle-wrapper.jar ]]; then
            chmod +x gradlew
            echo "command=./gradlew" >> "$GITHUB_OUTPUT"
            echo "Using project Gradle Wrapper."
          else
            echo "command=gradle" >> "$GITHUB_OUTPUT"
            echo "Using installed compatible Gradle."
          fi

          echo "Gradle execution configured."

      # ==========================================
      # 10. ENVIRONMENT DIAGNOSTICS
      # ==========================================

      - name: Print build environment
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "===== JAVA ====="
          java -version

          echo "===== GRADLE ====="
          gradle --version

          echo "===== ANDROID SDK ====="
          echo "$ANDROID_HOME"

          echo "===== SDK PLATFORMS ====="
          ls "$ANDROID_HOME/platforms"

          echo "===== BUILD TOOLS ====="
          ls "$ANDROID_HOME/build-tools"

          echo "===== PROJECT ====="
          find . -maxdepth 3 \
            \( -name build.gradle -o \
               -name build.gradle.kts -o \
               -name settings.gradle -o \
               -name settings.gradle.kts \) \
            -type f -print

      # ==========================================
      # 11. BUILD APK
      # ==========================================

      - name: Build Android Debug APK
        id: build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          GRADLE_COMMAND="${{ steps.gradle.outputs.command }}"

          echo "Using: $GRADLE_COMMAND"

          $GRADLE_COMMAND \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --no-configuration-cache \
            :app:assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$APK" ]]; then
            echo "::error::APK not found."

            find . -path '*/build/outputs/apk/*' -type f -print || true

            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK" "$GITHUB_WORKSPACE/output/app-debug.apk"

          echo "APK successfully generated."

          ls -lh "$GITHUB_WORKSPACE/output/app-debug.apk"

      # ==========================================
      # 12. VERIFY APK
      # ==========================================

      - name: Verify APK
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="$GITHUB_WORKSPACE/output/app-debug.apk"

          test -s "$APK"

          echo "APK size:"
          du -h "$APK"

          echo "SHA256:"
          sha256sum "$APK"

          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"

          if [[ -x "$AAPT" ]]; then
            "$AAPT" dump badging "$APK" | head -n 8 || true
          fi

      # ==========================================
      # 13. UPLOAD APK
      # ==========================================

      - name: Upload Android APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Universal-APK
          path: output/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ==========================================
      # 14. COLLECT BUILD DIAGNOSTICS
      # ==========================================

      - name: Collect diagnostic information
        if: failure()
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/diagnostics"

          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "JAVA:"
            java -version 2>&1
            echo "GRADLE:"
            gradle --version 2>&1 || true
            echo "SDK:"
            ls -la "$ANDROID_HOME/platforms" 2>&1 || true
            echo "BUILD TOOLS:"
            ls -la "$ANDROID_HOME/build-tools" 2>&1 || true
          } > "$GITHUB_WORKSPACE/diagnostics/environment.txt"

          if [[ -n "${PROJECT_DIR:-}" && -d "$PROJECT_DIR" ]]; then
            find "$PROJECT_DIR" \
              -type f \( \
                -name '*.log' -o \
                -name 'problems-report.html' \
              \) \
              -not -path '*/.gradle/*' \
              -exec cp --parents {} \
                "$GITHUB_WORKSPACE/diagnostics/" \; \
              2>/dev/null || true
          fi

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Build-Diagnostics
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 14

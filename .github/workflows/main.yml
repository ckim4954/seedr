
name: Build Seedr Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: seedr-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Do NOT use android-actions/setup-android.
      # That action invokes sdkmanager tools and fails on current SDK repositories.

      - name: Locate Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"

          if [[ ! -d "$ANDROID_HOME" ]]; then
            echo "::error::Android SDK directory not found."
            exit 1
          fi

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"

          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "SDK Manager: $SDKMANAGER"
          echo "SDK directory:"
          ls -la "$ANDROID_HOME"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -Eeuo pipefail

          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail

      - name: Install Android SDK components
        shell: bash
        run: |
          set -Eeuo pipefail

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36-ext1" \
            "build-tools;36.0.0"

          echo "Installed Android SDK packages:"
          "$SDKMANAGER" --list_installed

      - name: Locate or extract Android project
        shell: bash
        run: |
          set -Eeuo pipefail

          ROOT="$GITHUB_WORKSPACE"
          EXTRACT_ROOT="$RUNNER_TEMP/seedr-extracted"

          mkdir -p "$EXTRACT_ROOT"

          is_project() {
            local dir="$1"

            [[ -f "$dir/settings.gradle.kts" || -f "$dir/settings.gradle" ]] &&
            [[ -f "$dir/app/build.gradle.kts" || -f "$dir/app/build.gradle" ]]
          }

          PROJECT=""

          if is_project "$ROOT"; then
            PROJECT="$ROOT"
          else
            shopt -s nullglob
            ZIPS=("$ROOT"/*.zip)
            shopt -u nullglob

            if (( ${#ZIPS[@]} == 0 )); then
              echo "::error::No Android project or ZIP found."
              exit 1
            fi

            INDEX=0

            for ZIP in "${ZIPS[@]}"; do
              INDEX=$((INDEX + 1))
              DEST="$EXTRACT_ROOT/archive-$INDEX"

              mkdir -p "$DEST"

              python3 - "$ZIP" "$DEST" <<'PY'
          import os
          import sys
          import zipfile

          archive = sys.argv[1]
          destination = os.path.abspath(sys.argv[2])

          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  target = os.path.abspath(
                      os.path.join(destination, item.filename)
                  )

                  if os.path.commonpath(
                      [destination, target]
                  ) != destination:
                      raise SystemExit(
                          "Unsafe ZIP path: " + item.filename
                      )

              z.extractall(destination)

          print("Extracted:", archive)
          PY

              while IFS= read -r -d '' SETTINGS; do
                CANDIDATE="$(dirname "$SETTINGS")"

                if is_project "$CANDIDATE"; then
                  if [[ -n "$PROJECT" ]]; then
                    echo "::error::Multiple Android projects found."
                    exit 1
                  fi

                  PROJECT="$CANDIDATE"
                fi
              done < <(
                find "$DEST" \
                  -type d \( \
                    -name .git -o \
                    -name build -o \
                    -name .gradle -o \
                    -name node_modules \
                  \) -prune \
                  -o \( \
                    -name settings.gradle.kts -o \
                    -name settings.gradle \
                  \) -type f -print0
              )
            done
          fi

          if [[ -z "$PROJECT" ]]; then
            echo "::error::No valid Android project found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

          echo "Selected project: $PROJECT"

          echo "===== ROOT FILES ====="
          ls -la "$PROJECT"

          echo "===== APP FILES ====="
          ls -la "$PROJECT/app"

          echo "===== GRADLE CONFIGURATION ====="

          if [[ -f "$PROJECT/gradle/libs.versions.toml" ]]; then
            grep -E 'agp =|kotlin =|googleServices =' \
              "$PROJECT/gradle/libs.versions.toml" || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Verify build environment
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "===== JAVA ====="
          java -version

          echo "===== GRADLE ====="
          gradle --version

          echo "===== ANDROID SDK ====="
          echo "$ANDROID_HOME"

          echo "===== REQUIRED SDK ====="

          test -d "$ANDROID_HOME/platforms/android-36-ext1"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          test -d "$ANDROID_HOME/platform-tools"

          echo "===== PROJECT ====="

          test -f settings.gradle.kts -o -f settings.gradle
          test -f app/build.gradle.kts -o -f app/build.gradle

          echo "Environment verification completed."

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "===== START GRADLE BUILD ====="

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            :app:assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -f "$APK" ]]; then
            echo "::error::APK file not found."

            find app/build/outputs -type f -print || true

            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK" "$GITHUB_WORKSPACE/output/Seedr-debug.apk"

          echo "===== APK GENERATED ====="

          ls -lh "$GITHUB_WORKSPACE/output/Seedr-debug.apk"

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Seedr-Android-Debug-APK
          path: output/Seedr-debug.apk
          if-no-files-found: error
          retention-days: 14
